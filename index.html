  <title>Mochi Snake 3D Garden</title>

<body>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div id="hud-top">
      <div class="hud-pill">
        <span class="hud-label">APPLES</span>
        <span id="score-val" class="hud-val gold">00000</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">RECORD</span>
        <span id="best-val" class="hud-val matcha">00000</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">GARDEN</span>
        <span id="grid-val" class="hud-val berry">16x16</span>
      </div>
    </div>

    <div id="hud-bottom">
      <div class="info-pill">&#x2728; COZY GARDEN &middot; DRAG TO EXPLORE</div>
      <button id="btn-turntable" class="hud-btn" aria-label="Toggle Orbit">PAUSE ORBIT</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
